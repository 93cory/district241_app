<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="PNPI - Plateforme Nationale de Pilotage Industriel">
  <title>PNPI - Plateforme Nationale de Pilotage Industriel</title>
  <defs>
