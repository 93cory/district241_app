    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#ink)" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#051B36" stroke-width="1.4" opacity="0.28"/>

    <rect x="-38" y="36" width="76" height="12" rx="2" fill="#051B36"/>
    <rect x="-38" y="36" width="25" height="12" rx="2" fill="#009E60"/>
    <rect x="13" y="36" width="25" height="12" rx="2" fill="#003DA5"/>

    <rect x="-10" y="-38" width="20" height="74" fill="#051B36"/>
    <rect x="-10" y="-38" width="20" height="6" fill="#009E60"/>
    <rect x="-10" y="-26" width="20" height="5" fill="#FCD116" opacity="0.5"/>
    <polygon points="0,-62 6,-43 -6,-43" fill="#051B36"/>
    <circle cx="0" cy="-68" r="4.5" fill="#051B36"/>

