target-version = "py312"
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # assert used (OK in tests)
    "S105",  # hardcoded password (false positives on field names)
    "S106",  # hardcoded password argument
    "S110",  # try-except-pass (pattern "best-effort silent" utilise partout)
    "S608",  # SQL injection via raw query (faux positifs sur f-strings de log)
    "B008",  # function call in default argument (FastAPI Depends)
    "B904",  # raise ... from err (trop de points d'appel, cosmetique)
    "E501",  # line too long (handled by formatter)
    "E402",  # module-level import not at top (imports tardifs intentionnels)
    "E701",  # multiple statements on one line (style if x: return)
    "RUF003",  # ambiguous character (accents francais intentionnels)
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"alembic/**" = ["E402", "F401"]

[format]
quote-style = "double"
indent-style = "space"
