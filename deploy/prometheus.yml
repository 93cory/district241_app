# PNPI — Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pnpi-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scheme: http

  - job_name: "pnpi-minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
