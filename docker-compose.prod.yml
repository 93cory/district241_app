# ---------------------------------------------------------------
# PNPI — Docker Compose (production)
# ---------------------------------------------------------------

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pnpi-postgres
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pnpi}
      POSTGRES_USER: ${POSTGRES_USER:-pnpi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pnpi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pnpi_user} -d ${POSTGRES_DB:-pnpi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pnpi-net

  redis:
    image: redis:7-alpine
    container_name: pnpi-redis
    restart: always
    # Pas de port publie : uniquement joignable par le backend sur pnpi-net.
    command: redis-server --requirepass ${PNPI_REDIS_PASSWORD:?Set PNPI_REDIS_PASSWORD in .env.prod}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PNPI_REDIS_PASSWORD:?Set PNPI_REDIS_PASSWORD in .env.prod}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pnpi-net

  # Coffre-fort de secrets (dette D-012). Mode DEV UNIQUEMENT (donnees en
  # memoire, pas de scellement reel) — point de depart pour valider
  # l'integration applicative (core/secrets.py), pas un Vault de production.
  # Desactive par defaut : PNPI_SECRET_KEY / PNPI_FIELD_ENCRYPTION_KEY
  # restent lus depuis .env.prod tant que PNPI_VAULT_ADDR n'est pas defini
  # sur le service backend. Cf core/secrets.py pour la checklist de
  # durcissement avant un usage production reel.
  vault:
    image: hashicorp/vault:latest
    container_name: pnpi-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${PNPI_VAULT_TOKEN:-pnpi_vault_dev_root_token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    networks:
      - pnpi-net
    profiles:
      - vault

  backend:
    image: ghcr.io/${GHCR_OWNER:-pnpi}/pnpi-backend:${IMAGE_TAG:-latest}
    container_name: pnpi-backend
    restart: always
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PNPI_SECRET_KEY: ${PNPI_SECRET_KEY:?Set PNPI_SECRET_KEY in .env.prod}
      # Optionnel (dette D-012) : si defini, PNPI_SECRET_KEY et
      # PNPI_FIELD_ENCRYPTION_KEY sont lus depuis Vault en priorite (cf
      # core/secrets.py). Vide par defaut = comportement historique inchange.
      PNPI_VAULT_ADDR: ${PNPI_VAULT_ADDR:-}
      PNPI_VAULT_TOKEN: ${PNPI_VAULT_TOKEN:-}
      PNPI_ADMIN_PASSWORD: ${PNPI_ADMIN_PASSWORD:?Set PNPI_ADMIN_PASSWORD in .env.prod}
      PNPI_MINISTRE_PASSWORD: ${PNPI_MINISTRE_PASSWORD:?Set PNPI_MINISTRE_PASSWORD in .env.prod}
      PNPI_OPERATEUR_PASSWORD: ${PNPI_OPERATEUR_PASSWORD:?Set PNPI_OPERATEUR_PASSWORD in .env.prod}
      PNPI_INSPECTEUR_PASSWORD: ${PNPI_INSPECTEUR_PASSWORD:?Set PNPI_INSPECTEUR_PASSWORD in .env.prod}
      PNPI_DIRECTEUR_PASSWORD: ${PNPI_DIRECTEUR_PASSWORD:?Set PNPI_DIRECTEUR_PASSWORD in .env.prod}
      PNPI_INSTRUCTEUR_PASSWORD: ${PNPI_INSTRUCTEUR_PASSWORD:?Set PNPI_INSTRUCTEUR_PASSWORD in .env.prod}
      PNPI_TRUSTED_PROXY_NETWORKS: ${PNPI_TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      PNPI_DATABASE_URL: postgresql://${POSTGRES_USER:-pnpi_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pnpi}
      PNPI_REDIS_URL: redis://:${PNPI_REDIS_PASSWORD:?Set PNPI_REDIS_PASSWORD in .env.prod}@redis:6379/0
      PNPI_ENV: production
      PNPI_CORS_ALLOW_ORIGINS: ${PNPI_CORS_ALLOW_ORIGINS:-https://pnpi.gouv.ga}
      PNPI_S3_ENDPOINT: http://minio:9000
      PNPI_S3_BUCKET: pnpi-backups
      PNPI_S3_ACCESS_KEY: ${PNPI_S3_ACCESS_KEY:-pnpi_minio}
      PNPI_S3_SECRET_KEY: ${PNPI_S3_SECRET_KEY:-changeme_minio_secret}
      PNPI_BACKUP_RETAIN_DAYS: "30"
      # Stockage documents ATI / photos (dette D-001) : bucket dedie, distinct
      # des sauvegardes DB (cycle de vie/retention different). Reste en local
      # (PNPI_UPLOAD_DIR, comportement historique) tant que
      # PNPI_STORAGE_BACKEND n'est pas passe a "s3" — cf
      # scripts/migrate_uploads_to_s3.py pour la bascule (migrer AVANT
      # d'activer le flag, sinon les documents deja uploades en local
      # deviennent invisibles).
      PNPI_S3_DOCUMENTS_BUCKET: pnpi-documents
      PNPI_STORAGE_BACKEND: ${PNPI_STORAGE_BACKEND:-local}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pnpi-net

  frontend:
    image: ghcr.io/${GHCR_OWNER:-pnpi}/pnpi-frontend:${IMAGE_TAG:-latest}
    container_name: pnpi-frontend
    restart: always
    env_file: .env.prod
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:8000}
      PNPI_BACKEND_USERNAME: ${PNPI_BACKEND_USERNAME:-ministre}
      PNPI_BACKEND_PASSWORD: ${PNPI_BACKEND_PASSWORD:?Set PNPI_BACKEND_PASSWORD in .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pnpi-net

  minio:
    image: minio/minio:latest
    container_name: pnpi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PNPI_S3_ACCESS_KEY:-pnpi_minio}
      MINIO_ROOT_PASSWORD: ${PNPI_S3_SECRET_KEY:-changeme_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - pnpi-net

  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
    container_name: pnpi-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SSL_CERT_PATH:-./deploy/ssl}:/etc/ssl/pnpi:ro
      - pnpi_nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pnpi-net

  prometheus:
    image: prom/prometheus:latest
    container_name: pnpi-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pnpi-net

  grafana:
    image: grafana/grafana:latest
    container_name: pnpi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${PNPI_GRAFANA_PASSWORD:-pnpi_grafana_2026}
      GF_SERVER_ROOT_URL: https://pnpi-gabon.ga/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - pnpi-net

volumes:
  pnpi_postgres_data:
  redis_data:
  pnpi_nginx_logs:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  pnpi-net:
    driver: bridge
