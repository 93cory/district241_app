name: PNPI Cron

# Le workflow s'arme automatiquement quand la variable de repo
# PNPI_PROD_READY=true est definie ET que les secrets sont presents.
# Tant que ce n'est pas le cas, les declenchements automatiques (schedule)
# sont ignores au niveau du job pour eviter les faux echecs.
on:
  schedule:
    - cron: "5 * * * *"   # SLA + rappels (horaire)
    - cron: "0 3 * * *"   # cleanup (quotidien)
    - cron: "0 6 * * 1"   # rapport hebdo
  workflow_dispatch:
    inputs:
      task:
        description: "Tache a executer"
        required: true
        type: choice
        options:
          - sla-check
          - reminders
          - cleanup
          - weekly-report

permissions:
  contents: read

concurrency:
  group: cron-${{ github.event.schedule || github.event.inputs.task }}
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    # Tant que la variable PNPI_PROD_READY n'est pas a 'true', le job est
    # ignore sur les declenchements schedule (evite les echecs en pre-prod).
    # workflow_dispatch declenche toujours (utilisateur explicit).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PNPI_PROD_READY == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      PNPI_DATABASE_URL: ${{ secrets.PNPI_DATABASE_URL }}
      PNPI_SECRET_KEY: ${{ secrets.PNPI_SECRET_KEY }}
      PNPI_REDIS_URL: ${{ secrets.PNPI_REDIS_URL }}
      PNPI_SMTP_HOST: ${{ secrets.PNPI_SMTP_HOST }}
      PNPI_SMTP_PORT: ${{ secrets.PNPI_SMTP_PORT }}
      PNPI_SMTP_USER: ${{ secrets.PNPI_SMTP_USER }}
      PNPI_SMTP_PASSWORD: ${{ secrets.PNPI_SMTP_PASSWORD }}
      PNPI_SMTP_FROM: ${{ secrets.PNPI_SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determiner la tache
        id: task
        run: |
          if [ -n "${{ github.event.inputs.task }}" ]; then
            echo "name=${{ github.event.inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 * * * *" ]; then
            echo "name=sla-check-and-reminders" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "name=cleanup" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            echo "name=weekly-report" >> "$GITHUB_OUTPUT"
          else
            echo "name=sla-check" >> "$GITHUB_OUTPUT"
          fi

      - name: Executer la tache
        run: |
          case "${{ steps.task.outputs.name }}" in
            sla-check-and-reminders)
              python scripts/cron_tasks.py sla-check
              python scripts/cron_tasks.py reminders
              ;;
            *)
              python scripts/cron_tasks.py "${{ steps.task.outputs.name }}"
              ;;
          esac
