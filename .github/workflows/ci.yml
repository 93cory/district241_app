name: PNPI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend (Ruff)
        run: ruff check app/
      - name: Format check backend (Ruff)
        run: ruff format --check app/
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Format check frontend (Prettier)
        run: npm run format:check
      - name: Build frontend
        run: npm run build

  frontend_e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        # PostGIS requis pour la migration 20260321_07 (geometry, ST_SetSRID).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pnpi
          POSTGRES_PASSWORD: pnpi
          POSTGRES_DB: pnpi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PNPI_DATABASE_URL: postgresql+psycopg2://pnpi:pnpi@localhost:5432/pnpi_test
      PNPI_SECRET_KEY: e2e-secret-key-not-for-production
      PNPI_ENV: development
      PNPI_LOG_LEVEL: WARNING
      PNPI_CORS_ALLOW_ORIGINS: http://127.0.0.1:3100
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed PNPI demo data
        working-directory: backend
        run: python scripts/seed_pnpi.py || echo "Seed optional, ignoring."

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend ready."
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start." && cat backend.log && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/backend.log
          retention-days: 7

  flutter:
    runs-on: ubuntu-latest
    # Job conditionnel : ne tourne que si le projet Flutter existe (pubspec.yaml).
    # Le sprint mobile n'a pas encore demarre — a reactiver des qu'un dossier
    # mobile/ ou flutter_app/ contenant pubspec.yaml sera commite.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-0 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit npm dependencies
        run: cd frontend && npm audit --audit-level=high || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: pnpi-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: pnpi-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
