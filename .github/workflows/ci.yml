name: PNPI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend (Ruff)
        run: ruff check app/
      - name: Format check backend (Ruff)
        run: ruff format --check app/
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Format check frontend (Prettier)
        run: npm run format:check
      - name: Build frontend
        run: npm run build

  frontend_e2e:
    runs-on: ubuntu-latest
    needs: frontend
    # Job desactive temporairement : Playwright spawn son propre dev server
    # mais les tests SSR ont besoin du backend (FastAPI sur :8000) qui n'est
    # pas demarre dans ce job. Refactoring necessaire pour spawn backend +
    # frontend en services Docker avant les tests E2E.
    # A reactiver dans le lot 70 avec un setup complet.
    if: ${{ false }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e

  flutter:
    runs-on: ubuntu-latest
    # Job conditionnel : ne tourne que si le projet Flutter existe (pubspec.yaml).
    # Le sprint mobile n'a pas encore demarre — a reactiver des qu'un dossier
    # mobile/ ou flutter_app/ contenant pubspec.yaml sera commite.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-0 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit npm dependencies
        run: cd frontend && npm audit --audit-level=high || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: pnpi-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: pnpi-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
