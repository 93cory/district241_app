name: PNPI Backup

# Le workflow s'arme automatiquement quand vars.PNPI_PROD_READY=true.
# Tant que ce n'est pas le cas, le declenchement schedule est ignore.
on:
  schedule:
    - cron: "0 2 * * *"   # quotidien 02:00 UTC = 03:00 Libreville
  workflow_dispatch:
    inputs:
      action:
        description: "Action a executer"
        required: true
        default: "backup"
        type: choice
        options:
          - backup
          - list

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PNPI_PROD_READY == 'true' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PNPI_DATABASE_URL: ${{ secrets.PNPI_DATABASE_URL }}
      PNPI_S3_ENDPOINT: ${{ secrets.PNPI_S3_ENDPOINT }}
      PNPI_S3_BUCKET: ${{ secrets.PNPI_S3_BUCKET }}
      PNPI_S3_ACCESS_KEY: ${{ secrets.PNPI_S3_ACCESS_KEY }}
      PNPI_S3_SECRET_KEY: ${{ secrets.PNPI_S3_SECRET_KEY }}
      PNPI_S3_REGION: ${{ secrets.PNPI_S3_REGION }}
      PNPI_BACKUP_RETAIN_DAYS: ${{ vars.PNPI_BACKUP_RETAIN_DAYS || '30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pg_dump (PostgreSQL 16 client)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Install backend deps + boto3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Lancer la sauvegarde
        run: |
          action="${{ github.event.inputs.action || 'backup' }}"
          python scripts/backup_s3.py "$action"
