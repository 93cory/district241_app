name: PNPI Backup

on:
  schedule:
    # Tous les jours a 02:00 UTC (= 03:00 Libreville)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action a executer"
        required: true
        default: "backup"
        type: choice
        options:
          - backup
          - list

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PNPI_DATABASE_URL: ${{ secrets.PNPI_DATABASE_URL }}
      PNPI_S3_ENDPOINT: ${{ secrets.PNPI_S3_ENDPOINT }}
      PNPI_S3_BUCKET: ${{ secrets.PNPI_S3_BUCKET }}
      PNPI_S3_ACCESS_KEY: ${{ secrets.PNPI_S3_ACCESS_KEY }}
      PNPI_S3_SECRET_KEY: ${{ secrets.PNPI_S3_SECRET_KEY }}
      PNPI_S3_REGION: ${{ secrets.PNPI_S3_REGION }}
      PNPI_BACKUP_RETAIN_DAYS: ${{ secrets.PNPI_BACKUP_RETAIN_DAYS || '30' }}
    steps:
      - name: Skip si secrets non configures
        id: gate
        run: |
          missing=()
          [ -z "${{ secrets.PNPI_DATABASE_URL }}" ] && missing+=("PNPI_DATABASE_URL")
          [ -z "${{ secrets.PNPI_S3_ENDPOINT }}" ] && missing+=("PNPI_S3_ENDPOINT")
          [ -z "${{ secrets.PNPI_S3_ACCESS_KEY }}" ] && missing+=("PNPI_S3_ACCESS_KEY")
          [ -z "${{ secrets.PNPI_S3_SECRET_KEY }}" ] && missing+=("PNPI_S3_SECRET_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets manquants : ${missing[*]} — job ignore (mode pre-prod)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pg_dump (PostgreSQL 16 client)
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Install backend deps + boto3
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Lancer la sauvegarde
        if: steps.gate.outputs.skip != 'true'
        run: |
          action="${{ github.event.inputs.action || 'backup' }}"
          python scripts/backup_s3.py "$action"

      - name: Notifier echec
        if: failure() && steps.gate.outputs.skip != 'true'
        run: |
          echo "::error::Sauvegarde quotidienne PNPI a echoue. Verifier S3 endpoint et credentials."
